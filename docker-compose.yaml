services:
  postgres:
    image: postgres:15
    container_name: card_marketplace_db
    environment:
      POSTGRES_DB: card_marketplace
      POSTGRES_USER: luis
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luis -d card_marketplace"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: card_marketplace_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  localstack:
    image: localstack/localstack:4.14
    container_name: card_marketplace_localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    volumes:
      - ./localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:4566/_localstack/init/ready | grep -q '\"state\": \"SUCCESSFUL\"'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/card_marketplace
      SPRING_DATASOURCE_USERNAME: luis
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY}
      JUSTTCG_BASE_URL: ${JUSTTCG_BASE_URL}
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}

volumes:
  redis_data:
  postgres_data: