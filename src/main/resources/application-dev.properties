# Frontend
app.frontend-url=http://localhost:5173

# Hibernate
spring.jpa.show-sql=true

# Swagger/OpenAPI ? dev only, never prod
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# AWS S3 (dev = LocalStack)
aws.s3.endpoint=${AWS_S3_ENDPOINT}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.public-base-url=${aws.s3.endpoint}/${aws.s3.bucket}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/card_marketplace
spring.datasource.username=luis
spring.datasource.password=password

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.password=