# App
spring.application.name=card-marketplace

# Frontend
app.frontend-url=${APP_FRONTEND_URL}
server.forward-headers-strategy=framework

# Postgres
spring.datasource.url=${POSTGRES_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_NAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# oAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JustTcg
justtcg.api.key=${JUSTTCG_API_KEY}
justtcg.api.base-url=${JUSTTCG_BASE_URL:https://api.justtcg.com/v1}

# Swagger/OpenApi
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Aws
aws.s3.region=${AWS_S3_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.public-base-url=https://${aws.s3.bucket}.s3.${aws.s3.region}.amazonaws.com

# Pagination
spring.data.web.pageable.max-page-size=50
