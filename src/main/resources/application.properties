spring.application.name=card-marketplace
spring.profiles.active=dev

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/card_marketplace
spring.datasource.username=${POSTGRES_NAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# oAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JustTcg
justtcg.api.key=${JUSTTCG_API_KEY}
justtcg.api.base-url=${JUSTTCG_BASE_URL}

# Swagger/OpenApi
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Aws
aws.s3.endpoint=${AWS_S3_ENDPOINT}
aws.s3.region=${AWS_S3_REGION}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.bucket-name=${AWS_S3_BUCKET}
